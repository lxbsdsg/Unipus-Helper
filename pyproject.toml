[project]
name = "unipus-helper"
version = "2.0.0"
description = "U校园自动学习工具 — Python + Web UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
unipus-web = "unipus_web.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["unipus_web*"]

[tool.setuptools.package-data]
unipus_web = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
