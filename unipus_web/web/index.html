<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Unipus Helper</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主内容</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">U</span>
      <span class="brand-text">
        <span class="brand-name">Unipus Helper</span>
        <span class="brand-sub">U校园任务控制台</span>
      </span>
    </div>
    <div class="topbar-actions">
      <span id="conn-status" class="conn" data-state="connecting" role="status">
        <span class="conn-dot" aria-hidden="true"></span>
        <span id="conn-label">连接中</span>
      </span>
      <button id="debug-open" class="icon-btn" type="button" aria-label="打开日志与网络面板" title="日志与网络">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5l4 5-4 5M10 15h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="report-open" class="icon-btn" type="button" aria-label="生成问题报告" title="生成问题报告">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0l-3.5-3.5M10 12l3.5-3.5M4 15h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换深色模式" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M3.9 3.9l1.4 1.4M14.7 14.7l1.4 1.4M16.1 3.9l-1.4 1.4M5.3 14.7l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.4A6.8 6.8 0 017.6 4a6.8 6.8 0 108.4 8.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="shell">
    <section class="tasks" aria-labelledby="tasks-heading">
      <div class="section-head">
        <h2 id="tasks-heading">任务</h2>
        <p id="task-summary" class="section-meta">0 个任务</p>
      </div>

      <div id="task-list" class="task-list" aria-live="polite"></div>

      <div id="empty-state" class="empty">
        <p class="empty-title">还没有任务</p>
        <p class="empty-copy">登录 U校园账号后，程序会读取课程与必修任务。账号信息只保存在这台电脑上。</p>
        <button id="add-task-empty" class="btn btn-primary" type="button">添加任务</button>
      </div>

      <div class="task-foot">
        <button id="add-task" class="btn btn-primary" type="button">添加任务</button>
      </div>
    </section>
  </main>

  <!-- 添加任务 -->
  <dialog id="add-task-dialog" class="dialog">
    <form id="add-form" class="dialog-form" novalidate>
      <header class="dialog-head">
        <h2>添加任务</h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
      </header>

      <div class="segmented" role="tablist" aria-label="账号来源">
        <button type="button" class="seg is-active" data-add-mode="new" role="tab" aria-selected="true">新账号</button>
        <button type="button" class="seg" data-add-mode="saved" role="tab" aria-selected="false">已保存账号</button>
      </div>

      <div id="add-new" class="add-pane">
        <label class="field">
          <span>账号</span>
          <input id="add-username" name="username" autocomplete="username" placeholder="手机号 / 邮箱 / 用户名">
        </label>
        <label class="field">
          <span>密码</span>
          <input id="add-password" name="password" type="password" autocomplete="current-password" placeholder="U校园密码">
        </label>
        <label class="check">
          <input id="add-remember" type="checkbox">
          <span>登录成功后保存到本机</span>
        </label>
        <p class="hint">使用 Windows DPAPI 加密，仅当前用户可解密。</p>
      </div>

      <div id="add-saved" class="add-pane" hidden>
        <div id="saved-list" class="saved-list"></div>
        <p class="hint">已保存账号由服务端解密后登录，密码不会发送到浏览器。</p>
      </div>

      <p id="add-error" class="form-error" role="alert" hidden></p>

      <footer class="dialog-foot">
        <button type="button" class="btn btn-ghost" data-close>取消</button>
        <button type="submit" class="btn btn-primary" id="add-submit">登录并添加</button>
      </footer>
    </form>
  </dialog>

  <!-- 选择课程 -->
  <dialog id="course-dialog" class="dialog dialog-wide">
    <form id="course-form" class="dialog-form">
      <header class="dialog-head">
        <h2>选择课程与教程</h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
      </header>
      <div class="course-grid">
        <section>
          <h3>课程</h3>
          <div id="course-options" class="option-list" role="listbox" aria-label="课程"></div>
        </section>
        <section>
          <h3>教程</h3>
          <div id="resource-options" class="option-list" role="listbox" aria-label="教程"></div>
        </section>
      </div>
      <p id="course-error" class="form-error" role="alert" hidden></p>
      <footer class="dialog-foot">
        <button type="button" class="btn btn-ghost" data-close>取消</button>
        <button type="submit" class="btn btn-primary">确认选择</button>
      </footer>
    </form>
  </dialog>

  <!-- 任务管理 -->
  <dialog id="manage-dialog" class="dialog">
    <div class="dialog-form">
      <header class="dialog-head">
        <h2>任务详情</h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
      </header>
      <div id="manage-body" class="manage-body"></div>
      <footer class="dialog-foot" id="manage-actions"></footer>
    </div>
  </dialog>

  <!-- 报告 -->
  <dialog id="report-modal" class="dialog">
    <div class="dialog-form">
      <header class="dialog-head">
        <h2>生成问题报告</h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
      </header>
      <p>报告包含脱敏后的日志、网络请求和任务状态，用于排查问题。密码、Cookie、登录响应和用户信息请求不会进入报告。</p>
      <p class="hint">发送给他人前请自行检查内容。</p>
      <footer class="dialog-foot">
        <button type="button" class="btn btn-ghost" data-close>取消</button>
        <button type="button" class="btn btn-primary" id="report-download">下载报告</button>
      </footer>
    </div>
  </dialog>

  <!-- 确认 -->
  <dialog id="confirm-dialog" class="dialog dialog-small">
    <div class="dialog-form">
      <h2 id="confirm-title">确认操作</h2>
      <p id="confirm-message"></p>
      <footer class="dialog-foot">
        <button type="button" class="btn btn-ghost" id="confirm-cancel">取消</button>
        <button type="button" class="btn btn-danger" id="confirm-ok">确认</button>
      </footer>
    </div>
  </dialog>

  <!-- 调试抽屉 -->
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="debug-drawer" class="drawer" aria-hidden="true" aria-label="调试面板">
    <header class="drawer-head">
      <div class="tabs" role="tablist" aria-label="调试面板">
        <button class="tab is-active" type="button" data-tab="logs" role="tab" aria-selected="true">日志</button>
        <button class="tab" type="button" data-tab="network" role="tab" aria-selected="false">网络</button>
      </div>
      <button id="debug-close" class="icon-btn" type="button" aria-label="关闭调试面板">×</button>
    </header>

    <section id="panel-logs" class="panel">
      <div class="panel-tools">
        <label class="tool-field">
          <span>级别</span>
          <select id="log-level">
            <option value="">全部</option>
            <option value="ERROR">错误及以上</option>
            <option value="WARNING">警告及以上</option>
            <option value="INFO">信息及以上</option>
          </select>
        </label>
        <label class="tool-field grow">
          <span>搜索</span>
          <input id="log-search" type="search" placeholder="消息或任务 ID">
        </label>
        <label class="check compact"><input id="log-autoscroll" type="checkbox" checked><span>自动滚动</span></label>
        <button type="button" class="btn btn-ghost btn-sm" id="log-clear">清空</button>
        <button type="button" class="btn btn-ghost btn-sm" id="log-export">导出</button>
      </div>
      <div id="log-list" class="log-list" role="log" aria-live="polite"></div>
    </section>

    <section id="panel-network" class="panel" hidden>
      <div class="panel-tools">
        <label class="tool-field">
          <span>方法</span>
          <select id="net-method">
            <option value="">全部</option>
            <option>GET</option>
            <option>POST</option>
          </select>
        </label>
        <label class="tool-field">
          <span>状态</span>
          <select id="net-status">
            <option value="">全部</option>
            <option value="2xx">2xx</option>
            <option value="4xx">4xx</option>
            <option value="5xx">5xx</option>
            <option value="error">网络错误</option>
          </select>
        </label>
        <span id="net-count" class="panel-count">0 条</span>
        <button type="button" class="btn btn-ghost btn-sm" id="net-clear">清空</button>
      </div>
      <div id="network-list" class="network-list"></div>
    </section>
  </aside>

  <div id="toast-stack" class="toast-stack" aria-live="assertive"></div>

  <script src="/static/app.js" defer></script>
</body>
</html>
